<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚓ 海战棋 - Naval Warfare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB 0%,#5BA3D9 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;color:#1a3a52;user-select:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20%30%,rgba(255,255,255,.08)0%,transparent 50%),radial-gradient(ellipse at 80%70%,rgba(255,255,255,.06)0%,transparent 50%);pointer-events:none;z-index:0;animation:waveBg 8s ease-in-out infinite alternate}
@keyframes waveBg{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
.title{font-size:2.4em;font-weight:800;margin-top:20px;text-shadow:0 3px 6px rgba(26,58,82,.25);letter-spacing:4px;z-index:1;position:relative;display:flex;align-items:center;gap:12px}
.title span{animation:titleBob 3s ease-in-out infinite}
@keyframes titleBob{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)rotate(-2deg)}75%{transform:translateY(2px)rotate(2deg)}}
.status-bar{z-index:1;position:relative;margin-top:12px;padding:10px 28px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:30px;font-size:1.15em;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2);box-shadow:0 4px 15px rgba(0,0,0,.08);transition:all .3s ease;max-width:90%;text-align:center}
.status-bar.placing{background:rgba(76,175,80,.35)}.status-bar.battle{background:rgba(244,67,54,.35)}.status-bar.win{background:rgba(76,175,80,.55);font-size:1.3em}.status-bar.lose{background:rgba(244,67,54,.55);font-size:1.3em}
.game-container{display:flex;gap:40px;margin-top:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap;z-index:1;position:relative;padding-bottom:30px}
.board-panel{display:flex;flex-direction:column;align-items:center;gap:8px}
.board-label{font-size:1.1em;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.25);letter-spacing:2px}
.grid-wrapper{position:relative;padding:16px;background:rgba(255,255,255,.08);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.15)}
.grid{display:grid;grid-template-columns:repeat(10,48px);grid-template-rows:repeat(10,48px);gap:3px;position:relative}
.cell{width:48px;height:48px;background:rgba(135,206,250,.45);border:1.5px solid rgba(255,255,255,.22);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5em;transition:all .15s ease;position:relative}
.cell:hover{background:rgba(255,255,255,.35);transform:scale(1.06);z-index:2}
.cell.has-ship{background:rgba(139,105,65,.55);border-color:rgba(101,75,48,.5)}
.cell.preview{background:rgba(76,175,80,.6);border-color:#4CAF50;box-shadow:0 0 10px rgba(76,175,80,.5);z-index:2}
.cell.preview-invalid{background:rgba(244,67,54,.4);border-color:#F44336;box-shadow:0 0 10px rgba(244,67,54,.3);z-index:2}
.cell.hit{background:rgba(244,67,54,.7)!important;border-color:#c62828;animation:hitPulse .4s ease}
@keyframes hitPulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.cell.miss{background:rgba(255,255,255,.25)!important}
.cell.miss::after{content:'✕';color:rgba(255,255,255,.75);font-size:1.4em;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.2);animation:missPop .3s ease}
@keyframes missPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.ship-svg{width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.cell.sunk{background:rgba(80,60,40,.7)!important;animation:sinkShake .5s ease}
@keyframes sinkShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.ship-dock{z-index:1;position:relative;background:rgba(255,255,255,.13);backdrop-filter:blur(10px);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-width:220px;box-shadow:0 8px 28px rgba(0,0,0,.1)}
.dock-title{font-size:1em;font-weight:700;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.2);letter-spacing:1px;border-bottom:1.5px solid rgba(255,255,255,.2);padding-bottom:10px}
.ship-option{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.15);border-radius:10px;cursor:grab;transition:all .2s ease}
.ship-option:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4);transform:translateX(4px)}
.ship-option.selected{border-color:#FFD700;background:rgba(255,215,0,.2);box-shadow:0 0 12px rgba(255,215,0,.3)}
.ship-option.placed{opacity:.35;pointer-events:none;text-decoration:line-through}
.ship-option-name{font-weight:600;color:#fff;font-size:.92em;white-space:nowrap}
.ship-option-size{font-size:.8em;color:rgba(255,255,255,.65)}
.controls{z-index:1;position:relative;display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:11px 26px;font-size:1em;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:all .2s ease;letter-spacing:1px;text-transform:uppercase}
.btn-primary{background:linear-gradient(135deg,#43A047,#2E7D32);color:#fff;box-shadow:0 4px 12px rgba(46,125,50,.35)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(46,125,50,.5)}
.btn-secondary{background:linear-gradient(135deg,#42A5F5,#1976D2);color:#fff;box-shadow:0 4px 12px rgba(25,118,210,.35)}
.btn-secondary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(25,118,210,.5)}
.btn-danger{background:linear-gradient(135deg,#EF5350,#C62828);color:#fff;box-shadow:0 4px 12px rgba(198,40,40,.35)}
.btn-danger:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(198,40,40,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.rotate-hint{font-size:.85em;color:rgba(255,255,255,.8);text-align:center;margin-top:4px}
.rotate-hint kbd{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;font-family:inherit}
.scoreboard{z-index:1;position:relative;display:flex;gap:24px;margin-top:12px}
.score-card{background:rgba(255,255,255,.13);backdrop-filter:blur(8px);padding:12px 24px;border-radius:12px;text-align:center;min-width:130px}
.score-card-label{font-size:.82em;color:rgba(255,255,255,.75);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.score-card-value{font-size:2em;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.explosion{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#FF5722,#FF9800,transparent);animation:explode .6s ease-out forwards;pointer-events:none;z-index:10}
@keyframes explode{0%{transform:scale(.5);opacity:1}100%{transform:scale(3);opacity:0}}
.sink-effect{animation:sinkDown 1s ease-in forwards}
@keyframes sinkDown{0%{opacity:1;transform:translateY(0)rotate(0)}50%{opacity:.7;transform:translateY(10px)rotate(15deg)}100%{opacity:0;transform:translateY(30px)rotate(45deg)}}
.thinking::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%)rotate(360deg)}}
.battle-mode .player-grid .cell.has-ship:not(.hit):not(.sunk){background:rgba(135,206,250,.45)!important;border-color:rgba(255,255,255,.22)!important}
.battle-mode .player-grid .cell.has-ship:not(.hit):not(.sunk) .ship-svg{display:none}
@media(max-width:900px){.game-container{gap:20px}.grid{grid-template-columns:repeat(10,38px);grid-template-rows:repeat(10,38px)}.cell{width:38px;height:38px}.ship-svg{width:30px;height:30px}}
@media(max-width:600px){.title{font-size:1.6em}.grid{grid-template-columns:repeat(10,32px);grid-template-rows:repeat(10,32px);gap:2px}.cell{width:32px;height:32px;font-size:1.1em}.ship-svg{width:26px;height:26px}.game-container{flex-direction:column;align-items:center}.ship-dock{min-width:unset;width:100%;max-width:340px;flex-direction:row;flex-wrap:wrap;justify-content:center}.dock-title{width:100%}}

/* 战术卡系统样式 */
.tactical-cards{z-index:1;position:relative;display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.card-panel{background:rgba(255,255,255,.13);backdrop-filter:blur(8px);border-radius:12px;padding:12px;min-width:140px;display:flex;flex-direction:column;gap:8px}
.card-panel-title{font-size:.85em;font-weight:700;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.2);letter-spacing:1px}
.card{width:120px;height:160px;border-radius:10px;cursor:pointer;transition:all .3s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:10px;opacity:.2;z-index:0}
.card-scout{background:linear-gradient(135deg,#3498DB,#2980B9);border:2px solid #1ABC9C;box-shadow:0 4px 15px rgba(52,152,219,.4)}
.card-scout::before{background:radial-gradient(circle at 30%30%,#fff,transparent 60%)}
.card-volley{background:linear-gradient(135deg,#E74C3C,#C0392B);border:2px solid #F39C12;box-shadow:0 4px 15px rgba(231,76,60,.4)}
.card-volley::before{background:radial-gradient(circle at 30%30%,#fff,transparent 60%)}
.card:hover:not(.used):not(.disabled){transform:translateY(-5px)scale(1.05);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.card.active{transform:translateY(-10px)scale(1.1);box-shadow:0 0 20px rgba(255,215,0,.6),0 0 40px rgba(255,215,0,.3);border-color:#FFD700}
.card.used{opacity:.4;cursor:not-allowed;filter:grayscale(80%)}
.card.disabled{opacity:.6;cursor:not-allowed}
.card-icon{font-size:2.5em;z-index:1}
.card-name{font-size:1em;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:1;text-align:center}
.card-desc{font-size:.75em;color:rgba(255,255,255,.85);text-align:center;z-index:1;line-height:1.3}
.card-count{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.3);color:#fff;font-weight:700;font-size:.8em;padding:2px 6px;border-radius:50%}

/* 侦察模式样式 */
.scout-mode{cursor:crosshair!important}
.scout-highlight{background:rgba(255,215,0,.4)!important;border-color:#FFD700!important;animation:scoutPulse 1s ease-in-out infinite}
@keyframes scoutPulse{0%,100%{opacity:.4}50%{opacity:.7}}
.scout-reveal{position:relative}
.scout-reveal::after{content:'';position:absolute;top:2px;left:2px;right:2px;bottom:2px;border:2px dashed rgba(139,105,65,.7);border-radius:4px;animation:revealGlow 2s ease-in-out infinite}
@keyframes revealGlow{0%,100%{box-shadow:inset 0 0 10px rgba(139,105,65,.3)}50%{box-shadow:inset 0 0 20px rgba(139,105,65,.5)}}

/* 齐射模式提示 */
.volley-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(231,76,60,.9),rgba(192,57,43,.9));color:#fff;padding:20px 40px;border-radius:15px;font-size:1.5em;font-weight:700;z-index:1000;animation:volleyBounce .5s ease;box-shadow:0 0 30px rgba(231,76,60,.5)}
@keyframes volleyBounce{0%{transform:translate(-50%,-50%)scale(0)}50%{transform:translate(-50%,-50%)scale(1.1)}100%{transform:translate(-50%,-50%)scale(1)}}

/* 游戏模式选择界面 */
.mode-select{z-index:2;position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#2c3e50,#1a252f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.mode-select-title{font-size:2.5em;font-weight:800;color:#fff;text-shadow:0 4px 8px rgba(0,0,0,.3);display:flex;align-items:center;gap:15px}
.mode-select-title span{animation:titleBob 3s ease-in-out infinite}
.mode-cards{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.mode-card{width:280px;height:350px;border-radius:20px;cursor:pointer;transition:all .4s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;position:relative;overflow:hidden}
.mode-card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30%30%,rgba(255,255,255,.15),transparent 60%);z-index:0}
.mode-card-ai{background:linear-gradient(135deg,#3498DB,#2980B9);border:3px solid #1ABC9C;box-shadow:0 8px 30px rgba(52,152,219,.4)}
.mode-card-pvp{background:linear-gradient(135deg,#E74C3C,#C0392B);border:3px solid #F39C12;box-shadow:0 8px 30px rgba(231,76,60,.4)}
.mode-card:hover{transform:translateY(-10px)scale(1.05);box-shadow:0 15px 40px rgba(0,0,0,.3)}
.mode-card:hover::before{opacity:.3}
.mode-icon{font-size:5em;z-index:1}
.mode-name{font-size:1.8em;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);z-index:1}
.mode-desc{font-size:1.1em;color:rgba(255,255,255,.85);text-align:center;z-index:1;line-height:1.6}
.mode-btn{margin-top:20px;padding:15px 40px;font-size:1.2em;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:all .3s ease;z-index:1;color:#fff}
.mode-btn-ai{background:linear-gradient(135deg,#1ABC9C,#16A085);box-shadow:0 4px 15px rgba(26,188,156,.4)}
.mode-btn-pvp{background:linear-gradient(135deg,#F39C12,#E67E22);box-shadow:0 4px 15px rgba(243,156,18,.4)}
.mode-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.2)}

/* 双人对战模式样式 */
.pvp-mode .player-grid, .pvp-mode .enemy-grid{pointer-events:none}
.pvp-mode .placing-player1 .player-grid{pointer-events:auto}
.pvp-mode .placing-player2 .enemy-grid{pointer-events:auto}
.pvp-mode .battle-mode .player-grid, .pvp-mode .battle-mode .enemy-grid{pointer-events:auto}
.current-player-indicator{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(255,215,0,.9),rgba(255,165,0,.9));color:#fff;padding:10px 30px;border-radius:25px;font-size:1.1em;font-weight:700;z-index:1000;box-shadow:0 4px 15px rgba(255,215,0,.4);animation:pulseGlow 2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 4px 15px rgba(255,215,0,.4)}50%{box-shadow:0 4px 25px rgba(255,215,0,.6)}}

/* 船只能量条 */
.energy-bar-container{position:absolute;bottom:2px;left:2px;right:2px;height:4px;background:rgba(0,0,0,.3);border-radius:2px;overflow:hidden}
.energy-bar{height:100%;background:linear-gradient(90deg,#FFD700,#FFA500);transition:width .3s ease;border-radius:2px}
.energy-ready .energy-bar{animation:energyPulse .5s ease-in-out infinite}
@keyframes energyPulse{0%,100%{opacity:1}50%{opacity:.6}}

/* 闪电链效果 */
.lightning-chain{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;pointer-events:none;z-index:15}
.lightning-segment{position:absolute;background:linear-gradient(90deg,#FFD700,#FFA500);box-shadow:0 0 10px #FFD700,0 0 20px #FFA500;animation:lightningFlash .3s ease-out forwards}
@keyframes lightningFlash{0%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}100%{opacity:0;transform:scale(.8)}}

/* 能量盾效果 */
.shield-effect{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border:3px solid #42A5F5;border-radius:50%;box-shadow:0 0 20px #42A5F5,inset 0 0 20px rgba(66,165,245,.3);animation:shieldPulse .6s ease-in-out 2}
@keyframes shieldPulse{0%,100%{transform:translate(-50%,-50%)scale(1);opacity:.8}50%{transform:translate(-50%,-50%)scale(1.2);opacity:1}}
.shield-blocked{animation:shieldBlocked .5s ease-out}
@keyframes shieldBlocked{0%{background:rgba(66,165,245,.4);transform:scale(1)}50%{background:rgba(66,165,245,.6);transform:scale(1.1)}100%{background:transparent;transform:scale(1)}}

/* 穿甲光束效果 */
.pierce-beam{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:100%;background:linear-gradient(180deg,#FF5722,#F44336,#D32F2F);box-shadow:0 0 15px #FF5722,0 0 30px #F44336;animation:pierceAnim .5s ease-out forwards;z-index:14}
@keyframes pierceAnim{0%{height:0;opacity:1}30%{height:100%;opacity:1}100%{height:100%;opacity:0}}
.pierce-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;color:#FF5722;text-shadow:0 0 10px #FF5722,0 2px 4px rgba(0,0,0,.5);animation:pierceTextAnim .6s ease-out forwards;z-index:15}
@keyframes pierceTextAnim{0%{transform:translate(-50%,-50%)scale(.5);opacity:0}30%{transform:translate(-50%,-50%)scale(1.3);opacity:1}100%{transform:translate(-50%,-50%)scale(1);opacity:0}}

/* 大范围爆炸效果 */
.wave-explosion{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#FF9800,#FF5722,transparent);animation:waveExpand .6s ease-out forwards;z-index:12}
@keyframes waveExpand{0%{transform:translate(-50%,-50%)scale(1);opacity:1}100%{transform:translate(-50%,-50%)scale(4);opacity:0}}
.shockwave{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border:3px solid #FFA500;border-radius:50%;animation:shockwaveExpand .8s ease-out forwards;z-index:11}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%)scale(.5);opacity:1}100%{transform:translate(-50%,-50%)scale(5);opacity:0}}

/* 蘑菇云爆炸效果 */
.mushroom-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:12}
.mushroom-1{width:15px;height:15px;background:radial-gradient(circle,#FFEB3B,#FF9800,#FF5722);animation:mushroomStage1 .8s ease-out forwards}
@keyframes mushroomStage1{0%{transform:translate(-50%,-50%)scale(.5);opacity:1}50%{transform:translate(-50%,-50%)scale(2);opacity:1}100%{transform:translate(-50%,-50%)scale(3);opacity:.5}}
.mushroom-2{width:25px;height:25px;background:radial-gradient(circle,#FFA500,#FF5722,#D32F2F);animation:mushroomStage2 1s ease-out .3s forwards;opacity:0}
@keyframes mushroomStage2{0%{transform:translate(-50%,-50%)scale(.5);opacity:0}50%{transform:translate(-50%,-50%)scale(2.5);opacity:1}100%{transform:translate(-50%,-50%)scale(4);opacity:.3}}
.mushroom-3{width:35px;height:35px;background:radial-gradient(circle,#FF5722,#D32F2F,#B71C1C);animation:mushroomStage3 1.2s ease-out .6s forwards;opacity:0}
@keyframes mushroomStage3{0%{transform:translate(-50%,-50%)scale(.5);opacity:0}40%{transform:translate(-50%,-50%)scale(3);opacity:1}100%{transform:translate(-50%,-50%)scale(5);opacity:.2}}
.mushroom-cloud{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:40px;height:20px;background:radial-gradient(ellipse at center,#FFA500,#FF5722,transparent);border-radius:50%;animation:mushroomCloudRise 1.5s ease-out .8s forwards;opacity:0;z-index:13}
@keyframes mushroomCloudRise{0%{transform:translateX(-50%)translateY(0)scale(.5);opacity:0}50%{transform:translateX(-50%)translateY(-20px)scale(1.5);opacity:1}100%{transform:translateX(-50%)translateY(-40px)scale(2);opacity:0}}

/* 相邻格子高亮效果 */
.adjacent-highlight{background:rgba(255,152,0,.5)!important;border-color:#FF9800!important;animation:adjacentPulse .3s ease-in-out 2}
@keyframes adjacentPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* 3x3区域攻击高亮 */
.area-attack-cell{background:rgba(255,87,34,.5)!important;border-color:#FF5722!important;animation:areaPulse .2s ease-in-out}
@keyframes areaPulse{0%{transform:scale(.8)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

/* 闪避文字效果 */
.dodge-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;color:#42A5F5;text-shadow:0 0 10px #42A5F5,0 2px 4px rgba(0,0,0,.5);animation:dodgeTextAnim .6s ease-out forwards;z-index:15}
@keyframes dodgeTextAnim{0%{transform:translate(-50%,-50%)scale(.5);opacity:0}30%{transform:translate(-50%,-50%)scale(1.3);opacity:1}100%{transform:translate(-50%,-50%)scale(1);opacity:0}}
</style>
</head>
<body>

<!-- 游戏模式选择界面 -->
<div class="mode-select" id="modeSelect">
  <div class="mode-select-title"><span>⚓</span> 选择游戏模式 <span>⚓</span></div>
  <div class="mode-cards">
    <div class="mode-card mode-card-ai" onclick="selectGameMode('ai')">
      <div class="mode-icon">🤖</div>
      <div class="mode-name">人机对战</div>
      <div class="mode-desc">你布置船只，AI自动随机布置<br>战斗时你与AI轮流攻击</div>

<script>
const GRID_SIZE = 10;
const SHIPS_DATA = [
  {name:'巡逻艇',size:2,type:'patrol'}, {name:'护卫舰',size:3,type:'escort'}, 
  {name:'巡洋舰',size:3,type:'cruiser'}, {name:'战列舰',size:4,type:'battleship'}, 
  {name:'航空母舰',size:5,type:'carrier'}
];

const SHIP_SKILLS = {
  patrol: {name:'闪电连击',desc:'攻击命中后50%概率再攻击相邻格子',maxEnergy:2},
  escort: {name:'能量护盾',desc:'被攻击时30%概率闪避',maxEnergy:3},
  cruiser: {name:'穿甲打击',desc:'攻击必定命中，无视闪避',maxEnergy:3},
  battleship: {name:'轰炸范围',desc:'攻击时额外轰炸上下或左右相邻一格',maxEnergy:4},
  carrier: {name:'地毯轰炸',desc:'攻击3×3区域内所有目标',maxEnergy:5}
};

function shipSvgSmall(){return`<svg class="ship-svg"viewBox="0 0 64 64"><path d="M10,38 Q16,44 32,44 Q48,44 54,38 L50,34 L14,34Z"fill="#8B6914"stroke="#5D4E37"stroke-width="1.5"/><rect x="18"y="28"width="28"height="7"rx="2"fill="#A0784C"stroke="#5D4E37"/><line x1="30"y1="28"x2="30"y2="14"stroke="#5D4E37"stroke-width="2"/><polygon points="30,14 42,20 30,20"fill="#C0392B"/></svg>`}
function shipSvgMedium(){return`<svg class="ship-svg"viewBox="0 0 64 64"><path d="M6,40 Q16,47 32,47 Q48,47 58,40 L53,34 L11,34Z"fill="#8B6914"stroke="#5D4E37"stroke-width="1.5"/><rect x="14"y="27"width="36"height="8"rx="2"fill="#A0784C"stroke="#5D4E37"/><line x1="24"y1="27"x2="24"y2="10"stroke="#5D4E37"stroke-width="2.5"/><line x1="40"y1="27"x2="40"y2="14"stroke="#5D4E37"stroke-width="2"/><polygon points="24,10 38,17 24,17"fill="#C0392B"/><polygon points="40,14 50,19 40,19"fill="#E74C3C"/></svg>`}
function shipSvgCruiser(){return`<svg class="ship-svg"viewBox="0 0 64 64"><path d="M5,41 Q17,48 32,48 Q47,48 59,41 L54,34 L10,34Z"fill="#7D5A33"stroke="#4A3728"stroke-width="1.5"/><rect x="12"y="26"width="40"height="9"rx="2"fill="#9B7653"stroke="#4A3728"/><rect x="22"y="20"width="20"height="7"rx="1"fill="#B8926A"stroke="#4A3728"/><line x1="28"y1="20"x2="28"y2="6"stroke="#4A3728"stroke-width="2.5"/><line x1="38"y1="20"x2="38"y2="10"stroke="#4A3728"stroke-width="2"/><polygon points="28,6 42,13 28,13"fill="#B03A2E"/></svg>`}
function shipSvgLarge(){return`<svg class="ship-svg"viewBox="0 0 64 64"><path d="M3,43 Q16,51 32,51 Q48,51 61,43 L56,35 L8,35Z"fill="#6D4C2A"stroke="#3E2723"stroke-width="2"/><rect x="8"y="25"width="48"height="11"rx="2"fill="#8D6E43"stroke="#3E2723"stroke-width="1.5"/><rect x="18"y="17"width="28"height="9"rx="2"fill="#A88B6A"stroke="#3E2723"/><line x1="24"y1="17"x2="24"y2="4"stroke="#3E2723"stroke-width="3"/><line x1="42"y1="17"x2="42"y2="8"stroke="#3E2723"stroke-width="2.5"/><polygon points="24,4 40,12 24,12"fill="#922B21"/><polygon points="42,8 54,14 42,14"fill="#A93226"/></svg>`}
function shipSvgCarrier(){return`<svg class="ship-svg"viewBox="0 0 64 64"><path d="M1,44 Q16,53 32,53 Q48,53 63,44 L58,36 L6,36Z"fill="#5D4037"stroke="#3E2723"stroke-width="2"/><rect x="4"y="24"width="56"height="13"rx="3"fill="#795548"stroke="#3E2723"stroke-width="1.5"/><rect x="22"y="14"width="14"height="11"rx="1"fill="#8D6E63"stroke="#3E2723"stroke-width="1.5"/><line x1="28"y1="14"x2="28"y2="2"stroke="#3E2723"stroke-width="3"/><polygon points="28,2 42,10 28,10"fill="#C0392B"/></svg>`}

const SHIP_SVGS=[shipSvgSmall,shipSvgMedium,shipSvgCruiser,shipSvgLarge,shipSvgCarrier];

let playerBoard=[],enemyBoard=[];
let playerShips=[],enemyShips=[];
let selectedIdx=null,isHorizontal=true;
let phase='placing',isPlayerTurn=true;
let pSunk=0,eSunk=0;
let aiHunt=false,aiStack=[],aiLastHit=null;

let playerShipEnergy = {};
let enemyShipEnergy = {};
let skillMode = null;
let activeSkillShip = null;
let skillChainData = null;

// 游戏模式
let gameMode = null; // 'ai' 或 'pvp'
let currentPlacingPlayer = 1; // 1 或 2（只在PVP模式的放置阶段使用）
let player2Board = [];
let player2Ships = [];

// 放置历史记录（用于撤回功能）
let placementHistory = []; // 玩家1的放置历史
let placementHistoryP2 = []; // 玩家2的放置历史（双人模式）

// 战术卡系统
const CARD_TYPES = {
  SCOUT: { name: '侦察卡', icon: '🔭', desc: '侦察敌方3×3区域' },
  VOLLEY: { name: '齐射卡', icon: '💥', desc: '本回合可连开2炮' }
};

let playerCards = [];
let enemyCards = [];
let currentMode = 'normal'; // normal, scout, volley
let activeCard = null;
let volleyShotsLeft = 0;
let revealedCells = []; // 侦察卡揭示的格子

function initTacticalCards() {
  playerCards = [];
  enemyCards = [];
  currentMode = 'normal';
  activeCard = null;
  volleyShotsLeft = 0;
  revealedCells = [];

  // 每方随机获得2张战术卡
  for (let i = 0; i < 2; i++) {
    const cardType = Math.random() > 0.5 ? 'SCOUT' : 'VOLLEY';
    playerCards.push({ type: cardType, used: false, id: `p${i}` });
  }
  for (let i = 0; i < 2; i++) {
    const cardType = Math.random() > 0.5 ? 'SCOUT' : 'VOLLEY';
    enemyCards.push({ type: cardType, used: false, id: `e${i}` });
  }

  document.getElementById('tacticalCards').style.display = 'flex';
  renderCards();
}

function renderCards() {
  const playerCardsContainer = document.getElementById('playerCards');
  const enemyCardsContainer = document.getElementById('enemyCards');
  
  playerCardsContainer.innerHTML = '';
  enemyCardsContainer.innerHTML = '';

  // 渲染玩家卡牌
  playerCards.forEach(card => {
    const cardEl = createCardElement(card, true);
    playerCardsContainer.appendChild(cardEl);
  });

  // 渲染敌方卡牌（只显示数量，不显示类型）
  enemyCards.forEach(card => {
    const cardEl = createCardElement(card, false);
    enemyCardsContainer.appendChild(cardEl);
  });
}

function createCardElement(card, isPlayer) {
  const cardEl = document.createElement('div');
  const cardType = CARD_TYPES[card.type];
  
  if (isPlayer) {
    cardEl.className = `card card-${card.type.toLowerCase()}`;
    if (card.used) cardEl.classList.add('used');
    if (activeCard && activeCard.id === card.id) cardEl.classList.add('active');
    if (!isPlayerTurn || phase !== 'battle' || card.used) cardEl.classList.add('disabled');
    
    cardEl.innerHTML = `
      <div class="card-icon">${cardType.icon}</div>
      <div class="card-name">${cardType.name}</div>
      <div class="card-desc">${cardType.desc}</div>
    `;
    
    if (!card.used && isPlayerTurn && phase === 'battle') {
      cardEl.onclick = () => useCard(card);
    }
  } else {
    // 敌方卡牌只显示背面
    cardEl.className = `card card-scout`;
    if (card.used) cardEl.classList.add('used');
    
    cardEl.innerHTML = `
      <div class="card-icon">🎴</div>
      <div class="card-name">战术卡</div>
      <div class="card-desc">${card.used ? '已使用' : '未使用'}</div>
    `;
  }
  
  return cardEl;
}

function useCard(card) {
  if (phase !== 'battle' || !isPlayerTurn || card.used) return;
  
  // 取消当前激活的卡牌
  if (activeCard) {
    cancelCard();
  }
  
  activeCard = card;
  
  if (card.type === 'SCOUT') {
    currentMode = 'scout';
    setMsg('🔭 选择敌方 3×3 区域进行侦察');
    document.body.classList.add('scout-mode');
    
    // 添加鼠标悬停事件来显示3×3高亮
    document.querySelectorAll('.enemy-grid .cell').forEach(cell => {
      cell.onmouseenter = () => showScoutPreview(+cell.dataset.row, +cell.dataset.col);
      cell.onmouseleave = () => hideScoutPreview();
    });
  } else if (card.type === 'VOLLEY') {
    currentMode = 'volley';
    volleyShotsLeft = 2;
    setMsg('💥 齐射已激活！本回合可连开 2 炮');
    
    // 显示齐射提示
    showVolleyIndicator();
  }
  
  renderCards();
}

function cancelCard() {
  if (!activeCard) return;
  
  currentMode = 'normal';
  activeCard = null;
  volleyShotsLeft = 0;
  
  document.body.classList.remove('scout-mode');
  hideScoutPreview();
  
  // 恢复敌方格子的点击事件
  document.querySelectorAll('.enemy-grid .cell').forEach(cell => {
    const r = +cell.dataset.row;
    const c = +cell.dataset.col;
    cell.onclick = () => onAttack(r, c);
    cell.onmouseenter = null;
    cell.onmouseleave = null;
  });
  
  renderCards();
  updateUI();
}

function showScoutPreview(centerRow, centerCol) {
  hideScoutPreview();
  
  // 计算3×3区域的左上角
  const startRow = Math.max(0, centerRow - 1);
  const startCol = Math.max(0, centerCol - 1);
  const endRow = Math.min(GRID_SIZE - 1, centerRow + 1);
  const endCol = Math.min(GRID_SIZE - 1, centerCol + 1);
  
  for (let r = startRow; r <= endRow; r++) {
    for (let c = startCol; c <= endCol; c++) {
      const cell = document.querySelector(`.enemy-grid .cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) {
        cell.classList.add('scout-highlight');
      }
    }
  }
}

function hideScoutPreview() {
  document.querySelectorAll('.enemy-grid .cell.scout-highlight').forEach(cell => {
    cell.classList.remove('scout-highlight');
  });
}

function executeScout(centerRow, centerCol) {
  if (currentMode !== 'scout' || !activeCard) return;
  
  // 标记卡牌已使用
  activeCard.used = true;
  
  // 计算3×3区域
  const startRow = Math.max(0, centerRow - 1);
  const startCol = Math.max(0, centerCol - 1);
  const endRow = Math.min(GRID_SIZE - 1, centerRow + 1);
  const endCol = Math.min(GRID_SIZE - 1, centerCol + 1);
  
  // 记录揭示的格子
  const revealedShips = [];
  
  for (let r = startRow; r <= endRow; r++) {
    for (let c = startCol; c <= endCol; c++) {
      const v = enemyBoard[r][c];
      if (v && v.idx !== undefined && !v.revealed) {
        // 这是一个未被揭示的船
        revealedCells.push({ row: r, col: c });
        revealedShips.push(r, c);
      }
    }
  }
  
  // 更新渲染
  renderE();
  
  // 恢复正常模式
  const usedCard = activeCard;
  currentMode = 'normal';
  activeCard = null;
  document.body.classList.remove('scout-mode');
  hideScoutPreview();
  
  // 恢复敌方格子的点击事件
  document.querySelectorAll('.enemy-grid .cell').forEach(cell => {
    const r = +cell.dataset.row;
    const c = +cell.dataset.col;
    cell.onclick = () => onAttack(r, c);
    cell.onmouseenter = null;
    cell.onmouseleave = null;
  });
  
  if (revealedShips.length > 0) {
    setMsg(`🔭 侦察完成！发现了 ${Math.floor(revealedShips.length / 2)} 个敌方船只位置`);
  } else {
    setMsg('🔭 侦察完成！该区域没有发现敌方船只');
  }
  
  renderCards();
}

function showVolleyIndicator() {
  const indicator = document.createElement('div');
  indicator.className = 'volley-indicator';
  indicator.textContent = '💥 齐射已激活！';
  document.body.appendChild(indicator);
  
  setTimeout(() => {
    indicator.remove();
  }, 1500);
}

// ===== 游戏模式选择 =====
function selectGameMode(mode) {
  gameMode = mode;
  document.getElementById('modeSelect').style.display = 'none';
  document.getElementById('gameMain').style.display = 'block';
  
  if (mode === 'pvp') {
    // 双人对战模式
    document.body.classList.add('pvp-mode');
    document.body.classList.add('placing-player1');
    currentPlacingPlayer = 1;
    document.getElementById('switchPlayerBtn').style.display = 'none';
    document.getElementById('currentPlayerIndicator').style.display = 'block';
    document.getElementById('currentPlayerIndicator').textContent = '玩家1放置船只';
    document.getElementById('playerBoardLabel').textContent = '🏠 玩家1海域';
    document.getElementById('enemyBoardLabel').textContent = '🎯 玩家2海域';
  } else {
    // 人机对战模式
    document.body.classList.remove('pvp-mode');
    document.getElementById('switchPlayerBtn').style.display = 'none';
    document.getElementById('currentPlayerIndicator').style.display = 'none';
    document.getElementById('playerBoardLabel').textContent = '🏠 你的海域';
    document.getElementById('enemyBoardLabel').textContent = '🎯 敌方海域';
  }
  
  init();
  
  // 人机模式：初始化时就随机摆放敌方船只
  if (mode === 'ai') {
    randomlyPlaceShips(enemyBoard, enemyShips);
    renderE(); // 渲染敌方棋盘（数据已填充但需要更新DOM）
  }
}

function switchPlayer() {
  if (phase !== 'placing' || gameMode !== 'pvp') return;
  
  // 隐藏当前玩家的船只
  if (currentPlacingPlayer === 1) {
    // 玩家1切换到玩家2
    currentPlacingPlayer = 2;
    document.body.classList.remove('placing-player1');
    document.body.classList.add('placing-player2');
    document.getElementById('currentPlayerIndicator').textContent = '玩家2放置船只';
    
    // 重置船坞
    buildDock();
    selectedIdx = null;
    isHorizontal = true;
    
    // 切换到玩家2的棋盘
    // 注意：在双人模式中，玩家1使用playerGrid，玩家2使用enemyGrid
    // 重新初始化玩家2的棋盘
    enemyBoard = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(null));
    enemyShips = [];
    
    setMsg('🎯 玩家2放置你的舰队！选择船只后点击棋盘放置');
    
    // 隐藏玩家1的船只
    renderP();
    renderE();
  } else {
    // 玩家2完成放置，准备开始战斗
    currentPlacingPlayer = 1;
    document.body.classList.remove('placing-player2');
    document.body.classList.add('placing-player1');
    document.getElementById('currentPlayerIndicator').textContent = '双方放置完成，准备战斗！';
    
    // 检查双方是否都已放置完成
    if (playerShips.length === SHIPS_DATA.length && enemyShips.length === SHIPS_DATA.length) {
      document.getElementById('startBtn').disabled = false;
      setMsg('✅双方部署完毕！点击开始战斗');
    }
  }
  
  updateUI();
}

// ===== 初始化 =====
function init(){
  playerBoard=Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(null));
  enemyBoard=Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(null));
  playerShips=[];enemyShips=[];selectedIdx=null;isHorizontal=true;
  phase='placing';isPlayerTurn=true;pSunk=0;eSunk=0;
  aiHunt=false;aiStack=[];aiLastHit=null;
  
  // 重置能量系统
  playerShipEnergy = {};
  enemyShipEnergy = {};
  skillMode = null;
  activeSkillShip = null;
  skillChainData = null;
  
  // 重置双人模式相关变量
  currentPlacingPlayer = 1;
  player2Board = [];
  player2Ships = [];
  
  // 重置放置历史记录
  placementHistory = [];
  placementHistoryP2 = [];
  
  // 重置战术卡
  playerCards = [];
  enemyCards = [];
  currentMode = 'normal';
  activeCard = null;
  volleyShotsLeft = 0;
  revealedCells = [];
  document.getElementById('tacticalCards').style.display = 'none';

  document.getElementById('playerGrid').innerHTML='';
  document.getElementById('enemyGrid').innerHTML='';
  document.getElementById('gameContainer').classList.remove('battle-mode');
  document.getElementById('startBtn').disabled=true;
  document.getElementById('shipDock').style.opacity='1';
  
  // 隐藏切换玩家按钮，直到玩家1完成放置
  if (gameMode === 'pvp') {
    document.getElementById('switchPlayerBtn').style.display = 'none';
    document.getElementById('currentPlayerIndicator').textContent = '玩家1放置船只';
    document.body.classList.add('placing-player1');
    document.body.classList.remove('placing-player2');
  }

  for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
    const pc=document.createElement('div');pc.className='cell';pc.dataset.row=r;pc.dataset.col=c;
    // 玩家1的棋盘 - 总是用于放置和防御
    pc.onclick=()=>onPlace(r,c,'player');
    pc.onmouseenter=()=>hoverPreview(pc,r,c,'player');
    pc.onmouseleave=()=>{
      // 清除玩家棋盘上的所有预览效果
      document.querySelectorAll('.player-grid .cell.preview, .player-grid .cell.preview-invalid').forEach(cell => {
        cell.classList.remove('preview', 'preview-invalid');
      });
    };
    document.getElementById('playerGrid').appendChild(pc);
    
    const ec=document.createElement('div');ec.className='cell';ec.dataset.row=r;ec.dataset.col=c;
    // 敌方/玩家2的棋盘
    if (gameMode === 'pvp') {
      // 双人模式：玩家2在enemyGrid上放置船只
      ec.onclick=()=>onPlace(r,c,'enemy');
      ec.onmouseenter=()=>hoverPreview(ec,r,c,'enemy');
      ec.onmouseleave=()=>{
        // 清除敌方棋盘上的所有预览效果
        document.querySelectorAll('.enemy-grid .cell.preview, .enemy-grid .cell.preview-invalid').forEach(cell => {
          cell.classList.remove('preview', 'preview-invalid');
        });
      };
    } else {
      // 人机模式：enemyGrid只用于攻击
      ec.onclick=()=>onAttack(r,c);
    }
    document.getElementById('enemyGrid').appendChild(ec);
  }
  buildDock();updateUI();
}

function buildDock(){
  const dock=document.getElementById('shipDock');
  // 保存标题和旋转提示
  const titleEl = dock.querySelector('.dock-title');
  const hintEl = dock.querySelector('.rotate-hint');
  
  // 完全清空
  dock.innerHTML = '';
  
  // 重新添加标题和提示
  if (titleEl) dock.appendChild(titleEl);
  if (hintEl) dock.appendChild(hintEl);
  
  // 添加船只选项
  SHIPS_DATA.forEach((s,i)=>{
    const el=document.createElement('div');el.className='ship-option';el.id=`opt${i}`;
    el.innerHTML=`<span>${SHIP_SVGS[i]()}</span><div><div class="ship-option-name">${s.name}</div><div class="ship-option-size">${s.size}格</div></div>`;
    el.onclick=()=>pickShip(i);
    dock.appendChild(el);
  });
}

function pickShip(i){

  selectedIdx=i;
  document.querySelectorAll('.ship-option').forEach((e,j)=>e.classList.toggle('selected',j===i));
  updateUI();
}

function toggleRotation(){

  document.querySelectorAll('.cell.preview, .cell.preview-invalid').forEach(c=>c.classList.remove('preview', 'preview-invalid'));

// 撤回已放置的船只
function undoPlacement(){
  if(phase!=='placing')return;
  
  // 确定当前玩家的历史记录
  let currentHistory = placementHistory;
  let targetBoard = playerBoard;
  let targetShips = playerShips;
  
  if (gameMode === 'pvp') {
    if (currentPlacingPlayer === 2) {
      currentHistory = placementHistoryP2;
      targetBoard = enemyBoard;
      targetShips = enemyShips;
    }
  }
  
  // 检查是否有可撤回的放置
  if (currentHistory.length === 0) {
    shakeStatus('❌ 没有可撤回的放置');
    return;
  }
  
  // 从历史中获取最后一个放置
  const lastPlacement = currentHistory.pop();
  
  // 从棋盘上移除船只
  lastPlacement.cells.forEach(cell => {
    targetBoard[cell.row][cell.col] = null;
  });
  
  // 从船只列表中移除
  const shipIndex = targetShips.findIndex(s => s.idx === lastPlacement.idx);
  if (shipIndex !== -1) {
    targetShips.splice(shipIndex, 1);
  }
  
  // 恢复船坞中的船只选项
  const shipOption = document.getElementById(`opt${lastPlacement.idx}`);
  if (shipOption) {
    shipOption.classList.remove('placed');
  }
  
  // 选择刚撤回的船只，方便用户重新放置
  pickShip(lastPlacement.idx);
  
  // 恢复方向为放置时的方向
  isHorizontal = lastPlacement.isHorizontal;
  
  // 渲染棋盘
  if (lastPlacement.boardType === 'player') {
    renderP();
  } else {
    renderE();
  }
  
  // 更新UI
  updateUI();
  
  // 显示撤回成功消息
  setMsg(`↩️ 已撤回 ${SHIPS_DATA[lastPlacement.idx].name} 的放置`);
}

// ===== 放置 =====
function canPlace(bd,r,c,sz,h){
  for(let i=0;i<sz;i++){
    const rr=h?r:r+i,cc=h?c+i:c;
    if(rr>=GRID_SIZE||cc>=GRID_SIZE)return false;
    if(bd[rr][cc]!==null)return false;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=rr+dr,nc=cc+dc;
      if(nr>=0&&nr<GRID_SIZE&&nc>=0&&nc<GRID_SIZE&&bd[nr][nc]!==null)return false;
    }
  }
  return true;
}

function doPlace(bd,r,c,sz,h,idx){
  const cells=[];
  for(let i=0;i<sz;i++){
    const rr=h?r:r+i,cc=h?c+i:c;
    bd[rr][cc]={idx,hit:false};
    cells.push({row:rr,col:cc});
  }
  return cells;
}

// 通用的随机放置船只函数
function randomlyPlaceShips(board, ships){
  SHIPS_DATA.forEach((s,i)=>{
    let ok=false,tries=0;
    while(!ok&&tries<500){
      const h=Math.random()>.5,r=Math.floor(Math.random()*GRID_SIZE),c=Math.floor(Math.random()*GRID_SIZE);
      if(canPlace(board,r,c,s.size,h)){
        ships.push({...s,idx:i,cells:doPlace(board,r,c,s.size,h,i),sunk:false});
        ok=true;
      }
      tries++;
    }
  });
}

function onPlace(r,c,boardType){
  if(phase!=='placing'||selectedIdx===null)return;
  
  // 双人模式下，检查是否是当前放置玩家的棋盘
  if (gameMode === 'pvp') {
    if (currentPlacingPlayer === 1 && boardType !== 'player') return;
    if (currentPlacingPlayer === 2 && boardType !== 'enemy') return;
  }
  
  const s=SHIPS_DATA[selectedIdx];
  const targetBoard = boardType === 'player' ? playerBoard : enemyBoard;
  const targetShips = boardType === 'player' ? playerShips : enemyShips;
  
  if(!canPlace(targetBoard,r,c,s.size,isHorizontal)){shakeStatus('❌放不下！换位置');return}
  const cells=doPlace(targetBoard,r,c,s.size,isHorizontal,selectedIdx);
  const shipData = {...s,idx:selectedIdx,cells,sunk:false};
  targetShips.push(shipData);
  
  // 记录到放置历史
  const historyEntry = {
    idx: selectedIdx,
    row: r,
    col: c,
    isHorizontal: isHorizontal,
    size: s.size,
    cells: cells,
    boardType: boardType,
    shipData: shipData
  };
  
  if (gameMode === 'pvp') {
    if (currentPlacingPlayer === 1) {
      placementHistory.push(historyEntry);
    } else {
      placementHistoryP2.push(historyEntry);
    }
  } else {
    placementHistory.push(historyEntry);
  }
  
  document.getElementById(`opt${selectedIdx}`).classList.add('placed');
  selectedIdx=null;
  document.querySelectorAll('.ship-option').forEach(e=>e.classList.remove('selected'));
  
  // 渲染对应的棋盘
  if (boardType === 'player') {
    renderP();
  } else {
    renderE();
  }
  
  // 检查是否完成放置
  if (gameMode === 'pvp') {
    // 双人模式
    if (currentPlacingPlayer === 1 && playerShips.length === SHIPS_DATA.length) {
      // 玩家1完成放置
      document.getElementById('switchPlayerBtn').style.display = 'inline-block';
      setMsg('✅玩家1部署完毕！点击"切换玩家"让玩家2放置');
    } else if (currentPlacingPlayer === 2 && enemyShips.length === SHIPS_DATA.length) {
      // 玩家2完成放置
      document.getElementById('switchPlayerBtn').style.display = 'inline-block';
      setMsg('✅玩家2部署完毕！点击"切换玩家"开始战斗');
    } else {
      pickShip(targetShips.length);
    }
  } else {
    // 人机模式
    if(playerShips.length===SHIPS_DATA.length){
      document.getElementById('startBtn').disabled=false;
      setMsg('✅部署完毕！点击开始战斗');
    }else pickShip(playerShips.length);
  }
}

function hoverPreview(cell,r,c,type){
  if(phase!=='placing'||selectedIdx===null)return;
  
  // 双人模式下，检查是否是当前放置玩家的棋盘
  if (gameMode === 'pvp') {
    if (currentPlacingPlayer === 1 && type !== 'player') return;
    if (currentPlacingPlayer === 2 && type !== 'enemy') return;
  }
  
  // 清除之前的所有预览
  const gridSelector = type === 'player' ? '.player-grid' : '.enemy-grid';
  document.querySelectorAll(`${gridSelector} .cell.preview, ${gridSelector} .cell.preview-invalid`).forEach(c => {
    c.classList.remove('preview', 'preview-invalid');
  });
  
  const s=SHIPS_DATA[selectedIdx];
  const targetBoard = type === 'player' ? playerBoard : enemyBoard;
  const isValidPlacement = canPlace(targetBoard, r, c, s.size, isHorizontal);
  const previewClass = isValidPlacement ? 'preview' : 'preview-invalid';
  
  // 计算船只将要占据的所有格子并显示预览
  for(let i=0;i<s.size;i++){

    if(rr>=0 && rr<GRID_SIZE && cc>=0 && cc<GRID_SIZE){
      const t=document.querySelector(`${gridSelector} .cell[data-row="${rr}"][data-col="${cc}"]`);
      if(t)t.classList.add(previewClass);
    }

// ===== 渲染 =====
function renderP(){
  document.querySelectorAll('.player-grid .cell').forEach(cell=>{
    const r=+cell.dataset.row,c=+cell.dataset.col,v=playerBoard[r][c];
    cell.className='cell';cell.innerHTML='';
    if(v&&phase==='placing'){cell.classList.add('has-ship');cell.innerHTML=SHIP_SVGS[v.idx]()}
    else if(v&&v.hit){cell.classList.add('hit');if(phase!=='placing')cell.innerHTML=SHIP_SVGS[v.idx]()}
  });
  playerShips.forEach(s=>{
    if(s.sunk)s.cells.forEach(p=>{
      const c=document.querySelector(`.player-grid .cell[data-row="${p.row}"][data-col="${p.col}"]`);
      if(c)c.classList.add('sunk','sink-effect');
    });
  });
  // 显示敌方打中的miss
  for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
    if(playerBoard[r][c]&&playerBoard[r][c].missed){
      const cc=document.querySelector(`.player-grid .cell[data-row="${r}"][data-col="${c}"]`);
      if(cc&&!cc.classList.contains('has-ship'))cc.classList.add('miss');
    }
  }
}

function renderE(){
  document.querySelectorAll('.enemy-grid .cell').forEach(cell=>{
    const r=+cell.dataset.row,c=+cell.dataset.col,v=enemyBoard[r][c];
    cell.className='cell';cell.innerHTML='';
    
    // 检查是否是侦察卡揭示的格子
    const isRevealed = revealedCells.some(rc => rc.row === r && rc.col === c);
    
    if(v&&v.revealed){
      if(v.hit){cell.classList.add('hit');cell.innerHTML=SHIP_SVGS[v.idx]()}
      else cell.classList.add('miss');
    } else if (isRevealed && v && v.idx !== undefined) {
      // 侦察卡揭示的未命中船只 - 显示半透明轮廓
      cell.classList.add('scout-reveal');
      // 添加半透明的船只SVG
      const svg = SHIP_SVGS[v.idx]();
      // 给SVG添加半透明样式
      const semiTransparentSvg = svg.replace('class="ship-svg"', 'class="ship-svg" style="opacity:0.4"');
      cell.innerHTML = semiTransparentSvg;
    }
  });
  enemyShips.forEach(s=>{
    if(s.sunk)s.cells.forEach(p=>{
      const c=document.querySelector(`.enemy-grid .cell[data-row="${p.row}"][data-col="${p.col}"]`);
      if(c){c.classList.add('sunk','hit');c.innerHTML=SHIP_SVGS[s.idx]()}
    });
  });
}

function initShipEnergy() {
  playerShipEnergy = {};
  enemyShipEnergy = {};
  
  playerShips.forEach(ship => {
    const skill = SHIP_SKILLS[ship.type];
    playerShipEnergy[ship.idx] = {
      current: 0,
      max: skill.maxEnergy,
      type: ship.type,
      name: ship.name
    };
  });
  
  enemyShips.forEach(ship => {
    const skill = SHIP_SKILLS[ship.type];
    enemyShipEnergy[ship.idx] = {
      current: 0,
      max: skill.maxEnergy,
      type: ship.type,
      name: ship.name
    };
  });
}

function accumulateEnergy(ships, energyData) {
  ships.forEach(ship => {
    if (!ship.sunk && energyData[ship.idx]) {
      if (energyData[ship.idx].current < energyData[ship.idx].max) {
        energyData[ship.idx].current++;
      }
    }
  });
}

function getReadyShips(energyData) {
  const ready = [];
  for (const idx in energyData) {
    const ed = energyData[idx];
    if (ed.current >= ed.max) {
      ready.push({ idx: parseInt(idx), ...ed });
    }
  }
  return ready;
}

// 双人模式攻击函数
function onPvpAttack(r, c, targetBoardType) {
  // 侦察模式处理
  if (currentMode === 'scout') {
    // 检查是否攻击的是正确的目标
    if (isPlayerTurn && targetBoardType !== 'enemy') return;
    if (!isPlayerTurn && targetBoardType !== 'player') return;
    
    executeScout(r, c);
    return;
  }
  
  if(phase!=='battle')return;
  
  // 检查是否是当前玩家的回合，且攻击的是正确的目标
  if (isPlayerTurn) {
    // 玩家1的回合，只能攻击enemyBoard（玩家2的棋盘）
    if (targetBoardType !== 'enemy') return;
  } else {
    // 玩家2的回合，只能攻击playerBoard（玩家1的棋盘）
    if (targetBoardType !== 'player') return;
  }
  
  const targetBoard = targetBoardType === 'player' ? playerBoard : enemyBoard;
  const targetShips = targetBoardType === 'player' ? playerShips : enemyShips;
  const gridSelector = targetBoardType === 'player' ? '.player-grid' : '.enemy-grid';
  
  const v=targetBoard[r][c];
  if(v&&v.revealed)return; // 已点过

  // 齐射模式处理
  const isVolleyMode = currentMode === 'volley';
  
  if(!v){
    // miss
    targetBoard[r][c]={revealed:true,hit:false};
    boom(document.querySelector(`${gridSelector} .cell[data-row="${r}"][data-col="${c}"]`),false);
    
    if (targetBoardType === 'player') {
      renderP();
    } else {
      renderE();
    }
    
    if (isVolleyMode) {
      volleyShotsLeft--;
      if (volleyShotsLeft <= 0) {
        // 齐射结束，标记卡牌已使用
        if (activeCard) activeCard.used = true;
        currentMode = 'normal';
        activeCard = null;
        renderCards();
        
        // 切换玩家
        isPlayerTurn = !isPlayerTurn;
        if (isPlayerTurn) {
          document.getElementById('currentPlayerIndicator').textContent = '玩家1的回合';
          setMsg('💨玩家2未命中！玩家1的回合！');
        } else {
          document.getElementById('currentPlayerIndicator').textContent = '玩家2的回合';
          setMsg('💨玩家1未命中！玩家2的回合！');
        }
      } else {
        setMsg(`💨未命中！还剩 ${volleyShotsLeft} 次攻击机会`);
      }
    } else {
      // 切换玩家
      isPlayerTurn = !isPlayerTurn;
      if (isPlayerTurn) {
        document.getElementById('currentPlayerIndicator').textContent = '玩家1的回合';
        setMsg('💨玩家2未命中！玩家1的回合！');
      } else {
        document.getElementById('currentPlayerIndicator').textContent = '玩家2的回合';
        setMsg('💨玩家1未命中！玩家2的回合！');
      }
    }
  }else{
    // hit!
    v.revealed=true;v.hit=true;
    v.idx=v.idx!==undefined?v.idx:findShipIndex(targetShips,v);
    boom(document.querySelector(`${gridSelector} .cell[data-row="${r}"][data-col="${c}"]`),true);
    
    // 检查是否击沉
    const sinkType = targetBoardType === 'player' ? 'player2Attacks' : 'player1Attacks';
    checkSink(targetShips, v.idx, targetBoard, sinkType);
    
    if (targetBoardType === 'player') {
      renderP();
    } else {
      renderE();
    }
    
    // 检查游戏是否结束
    const player1AllSunk = playerShips.every(s => s.sunk);
    const player2AllSunk = enemyShips.every(s => s.sunk);
    
    if (player1AllSunk) {
      endGame(false, true);
      return;
    }
    if (player2AllSunk) {
      endGame(true, true);
      return;
    }
    
    if (isVolleyMode) {
      volleyShotsLeft--;
      if (volleyShotsLeft <= 0) {
        // 齐射结束，标记卡牌已使用
        if (activeCard) activeCard.used = true;
        currentMode = 'normal';
        activeCard = null;
        renderCards();
        
        // 切换玩家
        isPlayerTurn = !isPlayerTurn;
        if (isPlayerTurn) {
          document.getElementById('currentPlayerIndicator').textContent = '玩家1的回合';
          setMsg('💥玩家2命中！但齐射结束，玩家1的回合！');
        } else {
          document.getElementById('currentPlayerIndicator').textContent = '玩家2的回合';
          setMsg('💥玩家1命中！但齐射结束，玩家2的回合！');
        }
      } else {
        setMsg(`💥命中！还剩 ${volleyShotsLeft} 次攻击机会`);
      }
    } else {
      // 命中后继续当前玩家的回合
      const currentPlayer = isPlayerTurn ? '玩家1' : '玩家2';
      setMsg(`💥${currentPlayer}命中！继续攻击！`);
    }
  }
}

function finishPlayerTurn(showMessage) {

    setMsg('💨未命中！敌军回合...');
  }
  accumulateEnergy(enemyShips, enemyShipEnergy);
  isPlayerTurn = false;
  setTimeout(aiTurn, 1200);
}

    executeScout(r, c);
    return;
  }
  
  if(phase!=='battle'||!isPlayerTurn)return;
  const v=enemyBoard[r][c];
  if(v&&v.revealed)return;

  const isVolleyMode = currentMode === 'volley';
  const readyShip = getRandomReadyAttackerShip(playerShipEnergy);
  
  if (readyShip && readyShip.type === 'carrier') {
    executeCarrierAttack(r, c, enemyBoard, enemyShips, '.enemy-grid', playerShipEnergy, readyShip.idx);

function findShipIndex(ships,val){
  for(let i=0;i<ships.length;i++)if(ships[i].cells.some(p=>p.row===val.r&&p.col===val.c))return i;
  return 0;
}

// 通用的检查击沉函数
function checkSink(ships, idx, targetBoard, sinkType) {
  const s=ships[idx];if(!s||s.sunk)return;
  
  if(s.cells.every(p=>targetBoard[p.row][p.col]&&targetBoard[p.row][p.col].hit)){
    s.sunk=true;
    
    // 更新击沉计数
    if (sinkType === 'playerAttacks') {
      // 玩家攻击敌方（人机模式或双人模式玩家1攻击玩家2）
      pSunk++;
      setMsg(`🎉${s.name}被击沉！继续进攻！`);
    } else if (sinkType === 'enemyAttacks') {
      // AI攻击玩家或玩家2攻击玩家1
      eSunk++;
      setMsg(`🎉${s.name}被击沉！危险...`);
    } else if (sinkType === 'player1Attacks') {
      // 双人模式玩家1攻击玩家2
      pSunk++;
      setMsg(`🎉玩家1击沉了${s.name}！继续进攻！`);
    } else if (sinkType === 'player2Attacks') {
      // 双人模式玩家2攻击玩家1
      eSunk++;
      setMsg(`🎉玩家2击沉了${s.name}！继续进攻！`);
    }
    
    updScore();
  }
}

function finishAiTurn(showMessage) {

}

// ===== AI =====
function aiTurn(){
  if(phase!=='battle')return;
  const sb=document.getElementById('statusBar');
  sb.classList.add('thinking');

  setTimeout(()=>{
    sb.classList.remove('thinking');
    
    const unusedCards = enemyCards.filter(c => !c.used);
    let cardUsed = false;
    
    if (unusedCards.length > 0) {
      const scoutCard = unusedCards.find(c => c.type === 'SCOUT');
      const volleyCard = unusedCards.find(c => c.type === 'VOLLEY');
      
      if (!aiHunt && scoutCard && Math.random() > 0.5) {
        scoutCard.used = true;
        cardUsed = true;
        setMsg('🤖 敌方使用了侦察卡！');
        
        const centerRow = Math.floor(Math.random() * GRID_SIZE);
        const centerCol = Math.floor(Math.random() * GRID_SIZE);
        
        const startRow = Math.max(0, centerRow - 1);
        const startCol = Math.max(0, centerCol - 1);
        const endRow = Math.min(GRID_SIZE - 1, centerRow + 1);
        const endCol = Math.min(GRID_SIZE - 1, centerCol + 1);
        
        let foundShips = 0;
        for (let r = startRow; r <= endRow; r++) {
          for (let c = startCol; c <= endCol; c++) {
            const v = playerBoard[r][c];
            if (v && v.idx !== undefined && !v.hit && !v.missed) {
              foundShips++;
              if (!aiStack.some(t => t.r === r && t.c === c)) {
                aiStack.push({r, c});
              }
            }
          }
        }
        
        if (foundShips > 0) {
          aiHunt = true;
          setMsg(`🤖 敌方侦察发现了 ${foundShips} 个你的船只位置！`);
        } else {
          setMsg('🤖 敌方侦察没有发现你的船只');
        }
        
        renderCards();
        setTimeout(aiTurn, 1200);
        return;
      } else if (aiHunt && volleyCard && Math.random() > 0.4) {
        volleyCard.used = true;
        cardUsed = true;
        setMsg('🤖 敌方使用了齐射卡！将连续攻击2次！');
        renderCards();
        executeAiVolleyAttack(2);
        return;
      }
    }
    
    let r,c;

    if(aiHunt&&aiStack.length>0){
      let found=false;
      while(aiStack.length>0&&!found){
        const t=aiStack.shift();r=t.r;c=t.c;
        const pv=playerBoard[r][c];
        if(pv===null||(pv&&!pv.hit))found=true;
      }
      if(!found){aiHunt=false;aiLastHit=null;[r,c]=randEmpty();}
    }else{
      [r,c]=randEmpty();
    }

    const readyShip = getRandomReadyAttackerShip(enemyShipEnergy);
    
    if (readyShip && readyShip.type === 'carrier') {
      setMsg(`🤖 敌方${readyShip.name}发动地毯轰炸！`);
      executeCarrierAttack(r, c, playerBoard, playerShips, '.player-grid', enemyShipEnergy, readyShip.idx);
      
      setTimeout(() => {
        let anyHit = false;
        const startRow = Math.max(0, r - 1);
        const startCol = Math.max(0, c - 1);
        const endRow = Math.min(GRID_SIZE - 1, r + 1);
        const endCol = Math.min(GRID_SIZE - 1, c + 1);
        
        for (let row = startRow; row <= endRow; row++) {
          for (let col = startCol; col <= endCol; col++) {
            const cv = playerBoard[row][col];
            if (cv && cv.hit && cv.idx !== undefined) {
              checkSink(playerShips, cv.idx, playerBoard, 'enemyAttacks');
              anyHit = true;
              aiHunt = true;
              aiLastHit = { r: row, c: col };
              addAdjacents(row, col);
            }
          }
        }
        
        renderP();
        if (eSunk >= 5) { endGame(false, false); return; }
        
        if (anyHit) {
          setMsg('💥地毯轰炸命中！敌军继续攻击...');
          setTimeout(aiTurn, 1200);
        } else {
          finishAiTurn(true);
        }
      }, 1000);
      return;
    }
    
    if (readyShip && readyShip.type === 'battleship') {
      setMsg(`🤖 敌方${readyShip.name}发动范围轰炸！`);
      executeBattleshipAttack(r, c, playerBoard, playerShips, '.player-grid', enemyShipEnergy, readyShip.idx);
      
      setTimeout(() => {
        let anyHit = false;
        const startRow = Math.max(0, r - 1);
        const startCol = Math.max(0, c - 1);
        const endRow = Math.min(GRID_SIZE - 1, r + 1);
        const endCol = Math.min(GRID_SIZE - 1, c + 1);
        
        for (let row = startRow; row <= endRow; row++) {
          for (let col = startCol; col <= endCol; col++) {
            const cv = playerBoard[row][col];
            if (cv && cv.hit && cv.idx !== undefined) {
              checkSink(playerShips, cv.idx, playerBoard, 'enemyAttacks');
              anyHit = true;
              aiHunt = true;
              aiLastHit = { r: row, c: col };
              addAdjacents(row, col);
            }
          }
        }
        
        renderP();
        if (eSunk >= 5) { endGame(false, false); return; }
        
        if (anyHit) {
          setMsg('💥范围轰炸命中！敌军继续攻击...');
          setTimeout(aiTurn, 1200);
        } else {
          finishAiTurn(true);
        }
      }, 800);
      return;
    }
    
    if (readyShip && readyShip.type === 'cruiser') {
      setMsg(`🤖 敌方${readyShip.name}发动穿甲打击！必定命中！`);
      const result = executeCruiserAttack(r, c, playerBoard, playerShips, '.player-grid', enemyShipEnergy, readyShip.idx);
      
      if (result.hit) {
        checkSink(playerShips, result.shipIdx, playerBoard, 'enemyAttacks');
        aiHunt = true;
        aiLastHit = { r, c };
        addAdjacents(r, c);
      }
      
      renderP();
      if (eSunk >= 5) { endGame(false, false); return; }
      
      if (result.hit) {
        setMsg('💥穿甲打击命中！敌军继续攻击...');
        setTimeout(aiTurn, 1200);
      } else {
        finishAiTurn(true);
      }
      return;
    }
    
    if (readyShip && readyShip.type === 'patrol') {
      const cell = document.querySelector(`.player-grid .cell[data-row="${r}"][data-col="${c}"]`);
      const pv = playerBoard[r][c];
      
      if (pv === null) {
        playerBoard[r][c] = { revealed: true, hit: false, missed: true };
        boom(cell, false);
        renderP();
        finishAiTurn(true);
      } else if (pv && !pv.hit) {
        pv.hit = true;
        pv.revealed = true;
        pv.idx = pv.idx !== undefined ? pv.idx : findShipIndex(playerShips, pv);
        boom(cell, true);
        checkSink(playerShips, pv.idx, playerBoard, 'enemyAttacks');
        renderP();
        if (eSunk >= 5) { endGame(false, false); return; }
        
        aiHunt = true;
        aiLastHit = { r, c };
        addAdjacents(r, c);
        
        if (Math.random() > 0.5) {
          setMsg(`💥敌方${readyShip.name}命中！准备闪电连击...`);
          
          executePatrolBonusAttack(r, c, playerBoard, playerShips, '.player-grid', enemyShipEnergy, readyShip.idx, (hit, br, bc, bIdx) => {
            setTimeout(() => {
              if (hit && bIdx !== undefined) {
                checkSink(playerShips, bIdx, playerBoard, 'enemyAttacks');
                aiHunt = true;
                aiLastHit = { r: br, c: bc };
                addAdjacents(br, bc);
              }
              renderP();
              if (eSunk >= 5) { endGame(false, false); return; }
              
              if (hit) {
                setMsg('⚡闪电连击命中！敌军继续攻击...');
                setTimeout(aiTurn, 1200);
              } else {
                setMsg('⚡闪电连击未命中！轮到你！');
                finishAiTurn(false);
              }
            }, 500);
          });
        } else {
          setMsg('💥你的船被命中了！敌军继续...');
          setTimeout(aiTurn, 1200);
        }
      }
      return;
    }

    const cell = document.querySelector(`.player-grid .cell[data-row="${r}"][data-col="${c}"]`);
    const pv = playerBoard[r][c];

    if(pv===null){
      playerBoard[r][c]={revealed:true,hit:false,missed:true};
      boom(cell, false);
      renderP();
      finishAiTurn(true);
    }else if(pv&&!pv.hit){
      pv.idx = pv.idx !== undefined ? pv.idx : findShipIndex(playerShips, pv);
      
      if (checkEscortDodge(pv.idx, playerBoard, playerShips, playerShipEnergy, cell)) {
        playerBoard[r][c] = { revealed: true, hit: false, missed: true, dodged: true };
        setMsg('🛡️ 你的护卫舰闪避了攻击！');
        renderP();
        finishAiTurn(true);
        return;
      }
      
      pv.hit=true;pv.revealed=true;
      boom(cell,true);
      checkSink(playerShips, pv.idx, playerBoard, 'enemyAttacks');
      renderP();
      if(eSunk>=5){endGame(false, false);return;}

      aiHunt=true;aiLastHit={r,c};
      addAdjacents(r,c);

      setMsg('💥你的船被命中了！敌军继续...');
      setTimeout(aiTurn,1200);
    }
  },800);
}

function executeAiVolleyAttack(shotsLeft) {
  if (shotsLeft <= 0 || phase !== 'battle') {
    isPlayerTurn = true;
    setMsg('轮到你攻击！');
    return;
  }
  
  setTimeout(() => {
    let r, c;

    if (aiHunt && aiStack.length > 0) {
      let found = false;
      while (aiStack.length > 0 && !found) {
        const t = aiStack.shift();
        r = t.r;
        c = t.c;
        const pv = playerBoard[r][c];
        if (pv === null || (pv && !pv.hit)) found = true;
      }
      if (!found) {
        aiHunt = false;
        aiLastHit = null;
        [r, c] = randEmpty();
      }
    } else {
      [r, c] = randEmpty();
    }

    const pv = playerBoard[r][c];

    if (pv === null) {
      // AI miss
      playerBoard[r][c] = { revealed: true, hit: false, missed: true };
      boom(document.querySelector(`.player-grid .cell[data-row="${r}"][data-col="${c}"]`), false);
      renderP();
      setMsg(`💨敌军齐射落空！还剩 ${shotsLeft - 1} 次攻击`);
    } else if (pv && !pv.hit) {
      // AI hit
      pv.hit = true;
      pv.revealed = true;
      boom(document.querySelector(`.player-grid .cell[data-row="${r}"][data-col="${c}"]`), true);
      checkSink(playerShips, pv.idx, playerBoard, 'enemyAttacks');
      renderP();
      if (eSunk >= 5) {
        endGame(false, false);
        return;
      }

      // 进入追踪
      aiHunt = true;
      aiLastHit = { r, c };
      addAdjacents(r, c);

      setMsg(`💥你的船被命中！敌军还剩 ${shotsLeft - 1} 次攻击`);
    }

    // 继续下一次齐射攻击
    executeAiVolleyAttack(shotsLeft - 1);
  }, 800);
}

function randEmpty(){
  let empty=[];
  for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
    const v=playerBoard[r][c];
    if(v===null||(v&&!v.hit&&!v.missed))empty.push({r,c});
  }
  return empty[Math.floor(Math.random()*empty.length)]?[empty[Math.floor(Math.random()*empty.length)].r,empty[Math.floor(Math.random()*empty.length)].c]:[0,0];
}

function addAdjacents(r,c){
  [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<GRID_SIZE&&nc>=0&&nc<GRID_SIZE){
      const v=playerBoard[nr][nc];
      if(!v||(v&&!v.hit&&!v.revealed)&&!aiStack.some(t=>t.r===nr&&t.c===nc)){
        aiStack.push({r:nr,c:nc});
      }
    }
  });
}

function setMsg(t){document.getElementById('statusBar').textContent=t}
function shakeStatus(msg){
  const sb=document.getElementById('statusBar');
  sb.textContent=msg;sb.style.animation='none';void sb.offsetWidth;
  sb.style.animation='sinkShake .4s ease';setTimeout(()=>updateUI(),800);

function updScore(){
  document.getElementById('playerSinks').textContent=`${pSunk} / 5`;
  document.getElementById('enemySinks').textContent=`${eSunk} / 5`;

function boom(cell,isHit){
  if(!cell)return;
  const ex=document.createElement('div');
  ex.className='explosion';
  ex.style.left='50%';ex.style.top='50%';ex.style.transform='translate(-50%,-50%)';
  ex.style.background=isHit?'radial-gradient(circle,#FF5722,#F44336,transparent)':'radial-gradient(circle,#90CAF9,#42A5F5,transparent)';
  cell.appendChild(ex);
  setTimeout(()=>ex.remove(),600);
}

function showLightningEffect(fromCell, toCell) {
  if (!fromCell || !toCell) return;
  
  const fromRect = fromCell.getBoundingClientRect();
  const toRect = toCell.getBoundingClientRect();
  
  const gridWrapper = fromCell.closest('.grid-wrapper');
  const wrapperRect = gridWrapper.getBoundingClientRect();
  
  const lightning = document.createElement('div');
  lightning.className = 'lightning-chain';
  lightning.style.position = 'absolute';
  lightning.style.left = (fromRect.left - wrapperRect.left) + 'px';
  lightning.style.top = (fromRect.top - wrapperRect.top) + 'px';
  lightning.style.width = (toRect.left - fromRect.left) + 'px';
  lightning.style.height = (toRect.top - fromRect.top) + 'px';
  
  const segment = document.createElement('div');
  segment.className = 'lightning-segment';
  segment.style.width = '100%';
  segment.style.height = '3px';
  segment.style.top = '50%';
  segment.style.left = '50%';
  segment.style.transform = 'translate(-50%, -50%)';
  
  const angle = Math.atan2(toRect.top - fromRect.top, toRect.left - fromRect.left);
  segment.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;
  
  lightning.appendChild(segment);
  gridWrapper.appendChild(lightning);
  
  setTimeout(() => lightning.remove(), 400);
}

function showShieldEffect(cell) {
  if (!cell) return;
  
  const shield = document.createElement('div');
  shield.className = 'shield-effect';
  cell.appendChild(shield);
  
  const dodgeText = document.createElement('div');
  dodgeText.className = 'dodge-text';
  dodgeText.textContent = '闪避！';
  cell.appendChild(dodgeText);
  
  cell.classList.add('shield-blocked');
  
  setTimeout(() => {
    shield.remove();
    dodgeText.remove();
    cell.classList.remove('shield-blocked');
  }, 600);
}

function showPierceEffect(cell) {
  if (!cell) return;
  
  const beam = document.createElement('div');
  beam.className = 'pierce-beam';
  cell.appendChild(beam);
  
  const text = document.createElement('div');
  text.className = 'pierce-text';
  text.textContent = '穿透！';
  cell.appendChild(text);
  
  setTimeout(() => {
    beam.remove();
    text.remove();
  }, 600);
}

function showWaveExplosion(cell) {
  if (!cell) return;
  
  const wave = document.createElement('div');
  wave.className = 'wave-explosion';
  cell.appendChild(wave);
  
  const shock = document.createElement('div');
  shock.className = 'shockwave';
  cell.appendChild(shock);
  
  setTimeout(() => {
    wave.remove();
    shock.remove();
  }, 800);
}

function showMushroomExplosion(cell) {
  if (!cell) return;
  
  const m1 = document.createElement('div');
  m1.className = 'mushroom-stage mushroom-1';
  cell.appendChild(m1);
  
  const m2 = document.createElement('div');
  m2.className = 'mushroom-stage mushroom-2';
  cell.appendChild(m2);
  
  const m3 = document.createElement('div');
  m3.className = 'mushroom-stage mushroom-3';
  cell.appendChild(m3);
  
  const cloud = document.createElement('div');
  cloud.className = 'mushroom-cloud';
  cell.appendChild(cloud);
  
  setTimeout(() => {
    m1.remove();
    m2.remove();
    m3.remove();
    cloud.remove();
  }, 2000);
}

function highlightAdjacentCells(cells, gridSelector) {
  cells.forEach(pos => {
    const cell = document.querySelector(`${gridSelector} .cell[data-row="${pos.r}"][data-col="${pos.c}"]`);
    if (cell) {
      cell.classList.add('adjacent-highlight');
      setTimeout(() => cell.classList.remove('adjacent-highlight'), 600);
    }
  });
}

function getRandomReadyAttackerShip(energyData) {
  const attackTypes = ['patrol', 'cruiser', 'battleship', 'carrier'];
  const readyShips = [];
  
  for (const idx in energyData) {
    const ed = energyData[idx];
    if (ed.current >= ed.max && attackTypes.includes(ed.type)) {
      readyShips.push({ idx: parseInt(idx), ...ed });
    }
  }
  
  if (readyShips.length === 0) return null;
  
  const typePriority = ['carrier', 'battleship', 'cruiser', 'patrol'];
  for (const type of typePriority) {
    const ship = readyShips.find(s => s.type === type);
    if (ship) return ship;
  }
  
  return readyShips[Math.floor(Math.random() * readyShips.length)];
}

function checkEscortDodge(attackedShipIdx, targetBoard, targetShips, energyData, cell) {
  if (attackedShipIdx === undefined) return false;
  
  const targetShip = targetShips[attackedShipIdx];
  if (!targetShip || targetShip.type !== 'escort') return false;
  
  const energy = energyData[attackedShipIdx];
  if (!energy || energy.current < energy.max) return false;
  
  if (Math.random() > 0.3) return false;
  
  energy.current = 0;
  
  showShieldEffect(cell);
  
  return true;
}

function executeCruiserAttack(r, c, targetBoard, targetShips, gridSelector, energyData, shipIdx) {
  const v = targetBoard[r][c];
  
  if (energyData[shipIdx]) {
    energyData[shipIdx].current = 0;
  }
  
  const cell = document.querySelector(`${gridSelector} .cell[data-row="${r}"][data-col="${c}"]`);
  showPierceEffect(cell);
  
  if (!v) {
    targetBoard[r][c] = { revealed: true, hit: false };
    boom(cell, false);
    return { hit: false, isMiss: true };
  }
  
  v.revealed = true;
  v.hit = true;
  v.idx = v.idx !== undefined ? v.idx : findShipIndex(targetShips, v);
  
  boom(cell, true);
  
  return { hit: true, shipIdx: v.idx };
}

function executeBattleshipAttack(r, c, targetBoard, targetShips, gridSelector, energyData, shipIdx) {
  if (energyData[shipIdx]) {
    energyData[shipIdx].current = 0;
  }
  
  const mainCell = document.querySelector(`${gridSelector} .cell[data-row="${r}"][data-col="${c}"]`);
  showWaveExplosion(mainCell);
  
  const isHorizontal = Math.random() > 0.5;
  const adjacentCells = [];
  
  if (isHorizontal) {
    if (c > 0) adjacentCells.push({ r, c: c - 1 });
    if (c < GRID_SIZE - 1) adjacentCells.push({ r, c: c + 1 });
  } else {
    if (r > 0) adjacentCells.push({ r: r - 1, c });
    if (r < GRID_SIZE - 1) adjacentCells.push({ r: r + 1, c });
  }
  
  const results = [];
  
  const v = targetBoard[r][c];
  if (!v) {
    targetBoard[r][c] = { revealed: true, hit: false };
    boom(mainCell, false);
    results.push({ hit: false, isMiss: true, r, c });
  } else {
    v.revealed = true;
    v.hit = true;
    v.idx = v.idx !== undefined ? v.idx : findShipIndex(targetShips, v);
    boom(mainCell, true);
    results.push({ hit: true, shipIdx: v.idx, r, c });
  }
  
  adjacentCells.forEach(adj => {
    const adjCell = document.querySelector(`${gridSelector} .cell[data-row="${adj.r}"][data-col="${adj.c}"]`);
    const adjV = targetBoard[adj.r][adj.c];
    
    if (adjV && adjV.revealed) return;
    
    setTimeout(() => {
      if (adjCell) {
        showWaveExplosion(adjCell);
        
        if (!adjV) {
          targetBoard[adj.r][adj.c] = { revealed: true, hit: false };
          boom(adjCell, false);
        } else {
          adjV.revealed = true;
          adjV.hit = true;
          adjV.idx = adjV.idx !== undefined ? adjV.idx : findShipIndex(targetShips, adjV);
          boom(adjCell, true);
          results.push({ hit: true, shipIdx: adjV.idx, r: adj.r, c: adj.c });
        }
      }
    }, 200);
  });
  
  highlightAdjacentCells(adjacentCells, gridSelector);
  
  return results;
}

function executeCarrierAttack(r, c, targetBoard, targetShips, gridSelector, energyData, shipIdx) {
  if (energyData[shipIdx]) {
    energyData[shipIdx].current = 0;
  }
  
  const startRow = Math.max(0, r - 1);
  const startCol = Math.max(0, c - 1);
  const endRow = Math.min(GRID_SIZE - 1, r + 1);
  const endCol = Math.min(GRID_SIZE - 1, c + 1);
  
  const results = [];
  const allCells = [];
  
  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      allCells.push({ r: row, c: col });
    }
  }
  
  const centerCell = document.querySelector(`${gridSelector} .cell[data-row="${r}"][data-col="${c}"]`);
  if (centerCell) {
    showMushroomExplosion(centerCell);
  }
  
  let delay = 0;
  allCells.forEach(pos => {
    const cell = document.querySelector(`${gridSelector} .cell[data-row="${pos.r}"][data-col="${pos.c}"]`);
    const v = targetBoard[pos.r][pos.c];
    
    if (v && v.revealed) return;
    
    setTimeout(() => {
      if (cell) {
        cell.classList.add('area-attack-cell');
        setTimeout(() => cell.classList.remove('area-attack-cell'), 500);
        
        if (!v) {
          targetBoard[pos.r][pos.c] = { revealed: true, hit: false };
          boom(cell, false);
        } else {
          v.revealed = true;
          v.hit = true;
          v.idx = v.idx !== undefined ? v.idx : findShipIndex(targetShips, v);
          boom(cell, true);
          results.push({ hit: true, shipIdx: v.idx, r: pos.r, c: pos.c });
        }
      }
    }, delay);
    delay += 150;
  });
  
  return results;
}

function executePatrolBonusAttack(firstHitR, firstHitC, targetBoard, targetShips, gridSelector, energyData, shipIdx, callback) {
  if (energyData[shipIdx]) {
    energyData[shipIdx].current = 0;
  }
  
  const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
  const validTargets = [];
  
  directions.forEach(([dr, dc]) => {
    const nr = firstHitR + dr;
    const nc = firstHitC + dc;
    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
      const v = targetBoard[nr][nc];
      if (!v || (v && !v.revealed)) {
        validTargets.push({ r: nr, c: nc });
      }
    }
  });
  
  if (validTargets.length === 0) {
    if (callback) callback(false);
    return;
  }
  
  const target = validTargets[Math.floor(Math.random() * validTargets.length)];
  
  const fromCell = document.querySelector(`${gridSelector} .cell[data-row="${firstHitR}"][data-col="${firstHitC}"]`);
  const toCell = document.querySelector(`${gridSelector} .cell[data-row="${target.r}"][data-col="${target.c}"]`);
  
  setTimeout(() => {
    if (fromCell && toCell) {
      showLightningEffect(fromCell, toCell);
    }
    
    const v = targetBoard[target.r][target.c];
    const cell = toCell;
    
    if (!v) {
      targetBoard[target.r][target.c] = { revealed: true, hit: false };
      if (cell) boom(cell, false);
      if (callback) callback(false, target.r, target.c);
    } else {
      v.revealed = true;
      v.hit = true;
      v.idx = v.idx !== undefined ? v.idx : findShipIndex(targetShips, v);
      if (cell) boom(cell, true);
      if (callback) callback(true, target.r, target.c, v.idx);
    }
  }, 300);
}
