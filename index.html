<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海战棋 - 回合制坐标攻防游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 顶部状态栏 -->
        <header class="game-header">
            <div class="header-left">
                <h1 class="game-title">海战棋</h1>
                <span class="subtitle">BATTLESHIP</span>
            </div>
            <div class="header-center">
                <div id="turn-indicator" class="turn-indicator">
                    <span class="turn-label">当前回合</span>
                    <span class="turn-player">玩家</span>
                </div>
                <div id="combo-counter" class="combo-counter hidden">
                    <span class="combo-count">0</span>
                    <span class="combo-label">连击</span>
                </div>
            </div>
            <div class="header-right">
                <div class="difficulty-selector">
                    <label for="difficulty">难度:</label>
                    <select id="difficulty">
                        <option value="easy">新手</option>
                        <option value="normal" selected>普通</option>
                        <option value="hard">专家</option>
                    </select>
                </div>
                <button id="start-btn" class="btn btn-primary">开始游戏</button>
                <button id="restart-btn" class="btn btn-secondary hidden">重新开始</button>
            </div>
        </header>

        <!-- 主游戏区域 - 中央对战布局 -->
        <main class="game-main">
            <!-- 左侧：我方舰队信息和控制 -->
            <aside class="side-panel left-panel">
                <div class="panel-section">
                    <h3 class="panel-title">我方舰队</h3>
                    <div class="fleet-status-vertical" id="player-fleet-status"></div>
                </div>
                <div class="panel-section">
                    <div class="ship-placement-controls hidden" id="ship-placement">
                        <h3 class="panel-title">舰船部署</h3>
                        <div class="ship-selector" id="ship-selector"></div>
                        <div class="placement-controls">
                            <button id="rotate-btn" class="btn btn-small">旋转</button>
                            <button id="random-placement-btn" class="btn btn-small">随机部署</button>
                            <button id="confirm-placement-btn" class="btn btn-primary btn-small">确认部署</button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 中央：对战棋盘区域 -->
            <section class="battle-area">
                <!-- 敌方棋盘 -->
                <div class="board-wrapper enemy-wrapper">
                    <div class="board-label">敌方海域</div>
                    <div class="board-container">
                        <div class="board-3d-wrapper">
                            <div id="enemy-board" class="game-board">
                                <!-- 棋盘格子将由JS生成 -->
                            </div>
                        </div>
                    </div>
                    <div class="attack-controls hidden" id="attack-controls">
                        <div class="coordinate-display" id="coordinate-display">
                            <span class="coord-label">目标坐标:</span>
                            <span class="coord-value" id="target-coord">-</span>
                        </div>
                        <button id="fire-btn" class="btn btn-primary btn-large" disabled>发射</button>
                    </div>
                </div>

                <!-- 中央：3D战场场景和消息 -->
                <div class="center-connector">
                    <div class="scene-container">
                        <canvas id="three-scene"></canvas>
                    </div>
                    <div class="message-panel" id="message-panel">
                        <div class="message-content" id="message-content">部署你的舰队，准备开战！</div>
                    </div>
                </div>

                <!-- 玩家棋盘 -->
                <div class="board-wrapper player-wrapper">
                    <div class="board-label">我方舰队</div>
                    <div class="board-container">
                        <div class="board-3d-wrapper">
                            <div id="player-board" class="game-board">
                                <!-- 棋盘格子将由JS生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右侧：敌方舰队信息和环境状态 -->
            <aside class="side-panel right-panel">
                <div class="panel-section">
                    <h3 class="panel-title">敌方舰队</h3>
                    <div class="fleet-status-vertical" id="enemy-fleet-status"></div>
                </div>
                <div class="panel-section">
                    <h3 class="panel-title">环境状态</h3>
                    <div class="environment-panel">
                        <div class="env-item">
                            <span class="env-label">海况:</span>
                            <span class="env-value">平静</span>
                        </div>
                        <div class="env-item">
                            <span class="env-label">风向:</span>
                            <span class="env-value">东北风 3级</span>
                        </div>
                        <div class="env-item">
                            <span class="env-label">能见度:</span>
                            <span class="env-value">良好</span>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 游戏结果弹窗 -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="result-title">游戏结束</h2>
                <p id="result-message"></p>
                <div class="result-stats">
                    <div class="stat">
                        <span class="stat-label">总发射次数</span>
                        <span class="stat-value" id="total-shots">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">命中率</span>
                        <span class="stat-value" id="hit-rate">0%</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">最高连击</span>
                        <span class="stat-value" id="max-combo">0</span>
                    </div>
                </div>
                <button id="play-again-btn" class="btn btn-primary btn-large">再来一局</button>
            </div>
        </div>

        <!-- 音效控制 -->
        <div class="sound-controls">
            <button id="sound-toggle" class="sound-btn" title="音效开关">
                <span class="sound-icon">🔊</span>
            </button>
            <div class="volume-control hidden" id="volume-control">
                <input type="range" id="volume-slider" min="0" max="100" value="70">
            </div>
        </div>
    </div>

    <!-- 引入库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
